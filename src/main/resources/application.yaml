spring:
  application:
    name: Oson Market
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: "jdbc:postgresql://localhost:5432/osonmarket"
    username: "osonmarket"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
#      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      jdbc.time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    baseline-on-migrate: false

  jackson:
    time-zone: Asia/Tashkent
    deserialization:
      fail-on-unknown-properties: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "727567703450-bgktefcbujemtctt17rad3329p3bqohe.apps.googleusercontent.com"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope: [openid, email, profile]

jwt:
  secret: "${JWT_SECRET}"
  ttl-seconds: 900
  refresh-ttl-seconds: 2592000

brevo:
  api-key: "${BREVO_API_KEY}"
  sender-email: codebyzplatform@gmail.com
  base-url: https://api.brevo.com/v3

app:
  push:
    credentials-file: "${GOOGLE_APPLICATION_CREDENTIALS:}"
  catalog:
    seed-demo: false
  email:
    # Public HTTPS base URL serving /api/site/logo, accessible to email clients.
    public-base-url: "https://yt3.googleusercontent.com/RZw-lrL5nXgfgAZOiKLzaEuqNTI-PwrwgkJ12amxXoanCG8lz_GbvLTQbW2xXYkTNuwgC1yEEQ=s900-c-k-c0x00ffffff-no-rj"
  order-telegram:
    bot-token: "${ORDER_TELEGRAM_BOT_TOKEN}"
  google:
    frontend-callback: https://osonmarket24.uz/auth/google/callback
    mobile-callback: https://osonmarket24.uz/auth/mobile/google/callback
  default-admin:
    username: admin
    email: ziyatovzafar98@gmail.com
    password-hash: "${DEFAULT_ADMIN_PASSWORD_HASH}"
  auth:
    code-ttl-seconds: 300
    resend-seconds: 60
    max-attempts: 5
  profile:
    avatar-max-bytes: 2097152
    avatar-max-dimension: 2048
  cors-origin: https://osonmarket24.uz
  local-frontend-origin: http://localhost:3000
  mobile-frontend-origins: https://localhost,http://localhost,capacitor://localhost

server:
  port: 8080
  address: 127.0.0.1
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 10m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never